name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest zxing-cpp

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test (offline demo)
        run: python -m xuanjqd demo -o out

      - name: Smoke test (crawl parse, offline fixture)
        run: python -c "from xuanjqd.crawl import parse; from pathlib import Path; import sys; html=Path('tests/fixtures/home.html').read_text(encoding='utf-8'); talks=parse(html); print(len(talks), 'talks'); sys.exit(0 if talks else 1)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-py${{ matrix.python }}
          path: out/
          retention-days: 7
