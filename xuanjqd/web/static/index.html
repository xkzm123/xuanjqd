<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宣讲会签到码</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#0f172a; --sub:#64748b; --line:#e6eaf2;
    --accent:#1f6feb; --accent-soft:rgba(31,111,235,.09); --ok:#0f9d58; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{max-width:1240px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;gap:12px}
  .mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#0b2f6b,#1f6feb);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
  .bar h1{font-size:15.5px;margin:0;font-weight:650;letter-spacing:.01em}
  .meta{font-size:12px;color:var(--sub)}
  .meta b{color:var(--ink);font-weight:600}
  .spacer{flex:1}
  .btn{border:0;border-radius:11px;padding:9px 15px;font-size:13.5px;font-weight:600;
    cursor:pointer;background:var(--accent);color:#fff;transition:.15s;font-family:inherit}
  .btn:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.ghost:hover{border-color:#c8d4e8;background:#fbfcfe}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}

  .days{max-width:1240px;margin:0 auto;padding:16px 28px 4px;display:flex;gap:8px;
    overflow-x:auto;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:7px 14px;font-size:13px;cursor:pointer;color:var(--sub);transition:.15s;font-family:inherit}
  .chip:hover{border-color:#c8d4e8;color:var(--ink)}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip small{opacity:.6;margin-left:5px}

  main{max-width:1240px;margin:0 auto;padding:14px 28px 120px;
    display:grid;grid-template-columns:1fr 372px;gap:24px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .list{padding:6px}
  .row{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;
    transition:.13s;cursor:pointer}
  .row:hover{background:#f8fafd}
  .row+.row{border-top:1px solid #f1f4f9}
  .row input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
  .when{flex:0 0 82px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
  .when .t{font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .when .d{font-size:11.5px;color:var(--sub);margin-top:2px}
  .who{flex:1;min-width:0}
  .who h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who p{margin:4px 0 0;font-size:12.5px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .tag.new{background:rgba(15,157,88,.10);color:var(--ok)}
  .empty{padding:56px 20px;text-align:center;color:var(--sub);font-size:13.5px;line-height:2}

  aside{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
  .box{padding:18px}
  .box h2{margin:0 0 14px;font-size:12.5px;color:var(--sub);font-weight:650;
    letter-spacing:.08em;text-transform:uppercase}
  .count{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .count small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px;letter-spacing:0}
  .picked{margin:12px 0 16px;font-size:12.5px;color:var(--sub);line-height:1.9;
    max-height:110px;overflow:auto}
  .picked div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .divider{height:1px;background:var(--line);margin:18px 0}
  .range{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
  .range label{font-size:11.5px;color:var(--sub);display:block;margin-bottom:5px}
  .range input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
    font-size:13px;font-family:inherit;outline:none;color:var(--ink);background:#fff}
  .range input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .result .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .result img{width:100%;border:1px solid var(--line);border-radius:8px;display:block;cursor:zoom-in}
  .ok{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);margin-bottom:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .hint{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:10px}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:60;backdrop-filter:blur(3px)}
  .modal.on{display:flex}
  .modal .inner{background:#fff;border-radius:20px;padding:18px;max-width:520px;width:100%;
    max-height:92vh;overflow:auto}
  .modal img{width:100%;border-radius:12px;border:1px solid var(--line)}
  .modal .cap{font-size:13px;color:var(--sub);margin-top:12px;line-height:1.7}
  .modal .cap b{color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--ink);
    color:#fff;font-size:13px;padding:10px 18px;border-radius:11px;opacity:0;
    transition:.22s;pointer-events:none;z-index:80}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:1000px){main{grid-template-columns:1fr}aside{position:static}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="mark">签</div>
    <div>
      <h1>宣讲会签到码</h1>
      <div class="meta">数据来自 <b>job.hdu.edu.cn</b> · 更新于 <b id="fetched">—</b></div>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="refresh">重新抓取</button>
  </div>
</header>

<div class="days" id="days"></div>

<main>
  <section class="panel list" id="list">
    <div class="empty">正在抓取宣讲会…</div>
  </section>

  <aside>
    <section class="panel box">
      <h2>已选</h2>
      <div class="count"><span id="selCount">0</span><small>场</small></div>
      <div class="picked" id="picked"><span style="opacity:.6">勾选左边的宣讲会</span></div>
      <button class="btn" style="width:100%" id="genSelected" disabled>生成签到码</button>

      <div class="divider"></div>

      <h2>任意生成</h2>
      <div class="range">
        <div><label>起始编号</label><input id="startId" value="137324"></div>
        <div><label>数量</label><input id="count" value="5" type="number" min="1" max="60"></div>
      </div>
      <button class="btn ghost" style="width:100%" id="genRange">按编号生成</button>
      <div class="hint">不依赖列表，直接按编号连续生成，适合补漏。</div>
    </section>

    <section class="panel box result" id="result" style="display:none">
      <h2>生成结果</h2>
      <div class="ok"><span class="dot"></span><span id="resultMsg"></span></div>
      <div class="grid" id="thumbs"></div>
      <div style="display:flex;gap:8px">
        <a class="btn" style="flex:1;text-align:center;text-decoration:none;line-height:1.6"
           id="openGallery" target="_blank">打开网页画廊</a>
        <a class="btn ghost" style="flex:1;text-align:center;text-decoration:none;line-height:1.6"
           href="/api/zip" id="downloadZip">下载 zip</a>
      </div>
    </section>
  </aside>
</main>

<div class="modal" id="modal">
  <div class="inner">
    <img id="mimg" alt="签到码">
    <div class="cap" id="mcap"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const state = { talks: [], days: [], day: '', selected: new Set() };

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}

async function load(refresh){
  $('list').innerHTML = '<div class="empty">正在抓取宣讲会…</div>';
  try{
    const res = await fetch('/api/talks' + (refresh ? '?refresh=1' : ''));
    const data = await res.json();
    state.talks = data.talks || [];
    state.days = data.days || [];
    $('fetched').textContent = data.fetched_at || '—';
    if (data.error) toast(data.error);
    if (!state.talks.length){
      $('list').innerHTML = '<div class="empty">没有抓到宣讲会<br>点右上角「重新抓取」试试</div>';
    }
    if (state.talks.length){
      $('startId').value = Math.max(...state.talks.map(t => t.id)) + 1;
    }
    applyHash(); renderDays(); render();
  }catch(e){
    $('list').innerHTML = '<div class="empty">抓取失败：' + e + '</div>';
  }
}

function renderDays(){
  let html = `<button class="chip" data-d="" aria-pressed="${state.day === ''}">全部<small>${state.talks.length}</small></button>`;
  html += state.days.map(d => {
    const p = d.date.split('-');
    const w = '日一二三四五六'[new Date(d.date + 'T00:00:00').getDay()];
    return `<button class="chip" data-d="${d.date}" aria-pressed="${state.day === d.date}">${p[1]}-${p[2]} 周${w}<small>${d.count}</small></button>`;
  }).join('');
  $('days').innerHTML = html;
}

function filtered(){
  return state.talks.filter(t => !state.day || t.date === state.day);
}

function render(){
  const rows = filtered();
  if (!rows.length){ $('list').innerHTML = '<div class="empty">这一天没有宣讲会</div>'; return; }
  $('list').innerHTML = rows.map(t => `
    <label class="row">
      <input type="checkbox" data-id="${t.id}" ${state.selected.has(t.id) ? 'checked' : ''}>
      <div class="when"><div class="t">${t.time || '--:--'}</div><div class="d">${t.date_label}</div></div>
      <div class="who">
        <h3>${t.company}</h3>
        <p>
          <span>${t.location || '地点待定'}</span>
          <span class="tag">#${t.id}</span>
          ${t.status ? `<span class="tag new">${t.status}</span>` : ''}
        </p>
      </div>
      <button class="btn ghost sm" data-prev="${t.id}">预览</button>
    </label>`).join('');
  syncPanel();
}

function applyHash(){
  const m = (location.hash || '').match(/ids=([\d,]+)/);
  if (!m) return;
  m[1].split(',').forEach(x => { const id = Number(x); if (id) state.selected.add(id); });
  syncPanel();
}

function syncPanel(){
  $('selCount').textContent = state.selected.size;
  $('genSelected').disabled = state.selected.size === 0;
  const box = $('picked');
  if (!state.selected.size){ box.innerHTML = '<span style="opacity:.6">勾选左边的宣讲会</span>'; return; }
  box.innerHTML = [...state.selected].map(id => {
    const t = state.talks.find(x => x.id === id);
    return `<div>${t ? t.company : '#' + id}</div>`;
  }).join('');
}

$('days').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.day = b.dataset.d;
  [...$('days').children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  render();
});

$('list').addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
  const id = Number(cb.dataset.id);
  cb.checked ? state.selected.add(id) : state.selected.delete(id);
  syncPanel();
});

$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-prev]'); if (!b) return;
  e.preventDefault();
  const id = Number(b.dataset.prev);
  const t = state.talks.find(x => x.id === id) || {};
  $('mimg').src = `/api/preview.png?id=${id}&t=${Date.now()}`;
  $('mcap').innerHTML = `<b>${t.company || '#' + id}</b><br>${t.date_label || ''} ${t.time || ''} · ${t.location || '地点待定'}<br>#${id}`;
  $('modal').classList.add('on');
});

$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('on'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').classList.remove('on'); });

$('refresh').onclick = () => { state.selected.clear(); load(true); toast('已重新抓取'); };

async function generate(body, label){
  const btns = document.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  toast('正在生成…');
  try{
    const res = await fetch('/api/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (!res.ok){ const err = await res.json().catch(() => ({})); throw new Error(err.detail || res.status); }
    const data = await res.json();
    $('result').style.display = '';
    $('resultMsg').textContent = `已生成 ${data.count} 场 · 自检 ${data.verified}/${data.count}`;
    const qr = (data.files || []).filter(f => f.name.startsWith('qr/')).slice(0, 6);
    $('thumbs').innerHTML = qr.map(f =>
      `<img src="/api/file?p=${encodeURIComponent(f.name)}&t=${Date.now()}" alt="">`).join('');
    $('openGallery').href = '/api/file?p=index.html';
    $('result').scrollIntoView({behavior: 'smooth', block: 'nearest'});
    toast(label);
  }catch(e){
    toast('生成失败：' + e.message);
  }finally{
    btns.forEach(b => b.disabled = false);
    syncPanel();
  }
}

$('genSelected').onclick = () => generate({ids: [...state.selected]}, '生成完成');
$('genRange').onclick = () => {
  const start = Number($('startId').value), count = Number($('count').value);
  if (!start || !count) return toast('填一下起始编号和数量');
  generate({start, count}, `已按编号生成 ${count} 场`);
};

load(false);
</script>
</body>
</html>
