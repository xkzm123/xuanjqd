<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宣讲会签到码 · 设计器</title>
<style>
  :root{
    --bg:#f6f8fc; --card:#fff; --ink:#0f172a; --sub:#64748b; --line:#e5eaf3;
    --accent:#1f6feb; --accent-soft:rgba(31,111,235,.10); --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  header{height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;
    background:rgba(255,255,255,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0b2f6b,#1f6feb);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.01em}
  header .ver{font-size:11.5px;color:var(--sub);border:1px solid var(--line);
    padding:2px 7px;border-radius:999px;background:#fff}
  header .spacer{flex:1}
  header a{font-size:13px;color:var(--sub);text-decoration:none}
  header a:hover{color:var(--accent)}

  .layout{display:grid;grid-template-columns:360px 1fr;gap:24px;
    max-width:1240px;margin:0 auto;padding:26px 28px 60px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .panel h2{font-size:13px;margin:0 0 16px;color:var(--sub);font-weight:600;
    letter-spacing:.08em;text-transform:uppercase}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
  input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-size:13.5px;color:var(--ink);background:#fff;outline:none;transition:.15s;font-family:inherit}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .switch{display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;font-size:13.5px;border-top:1px dashed var(--line)}
  .switch:first-of-type{border-top:0}
  .switch input{width:auto}
  .tog{position:relative;width:38px;height:22px;border-radius:999px;background:#d7deea;
    transition:.2s;flex:0 0 auto;cursor:pointer}
  .tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;
    border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .tog.on{background:var(--accent)}
  .tog.on::after{left:19px}
  .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .sw{border:1px solid var(--line);border-radius:11px;padding:8px;cursor:pointer;background:#fff;
    display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);transition:.15s}
  .sw:hover{border-color:#c7d5ea;transform:translateY(-1px)}
  .sw.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .dot{width:14px;height:14px;border-radius:5px;flex:0 0 auto}

  .preview{position:sticky;top:88px}
  .stage{background:
      radial-gradient(circle at 20% 10%,rgba(31,111,235,.06),transparent 45%),
      linear-gradient(180deg,#fff,#f8fafe);
    border:1px solid var(--line);border-radius:var(--radius);
    min-height:520px;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden}
  .stage img{max-width:100%;max-height:620px;border-radius:12px;
    box-shadow:0 18px 48px rgba(15,23,42,.14);transition:opacity .18s}
  .stage img.loading{opacity:.35}
  .badge{position:absolute;left:16px;top:14px;font-size:11.5px;color:var(--sub);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .bar{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;border:0;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:600;
    cursor:pointer;background:var(--accent);color:#fff;transition:.15s}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .url{margin-top:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    color:var(--sub);background:#f8fafc;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;word-break:break-all;line-height:1.6}
  .hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
  @media (max-width:960px){.layout{grid-template-columns:1fr}.preview{position:static}}
</style>
</head>
<body>
<header>
  <div class="mark">签</div>
  <h1>宣讲会签到码 · 设计器</h1>
  <div class="spacer"></div>
  <a href="/api/docs" target="_blank">API</a>
</header>

<div class="layout">
  <div>
    <div class="panel">
      <h2>内容</h2>
      <div class="field"><label>公司名称</label>
        <input id="company" value="浙江明贺钢管有限公司"></div>
      <div class="field"><label>宣讲会标题</label>
        <input id="title" value="2026 届校园宣讲会 · 机械/材料"></div>
      <div class="row">
        <div class="field"><label>日期</label><input id="date" type="date"></div>
        <div class="field"><label>时间</label><input id="time" type="time" value="14:00"></div>
      </div>
      <div class="field"><label>地点</label><input id="location" value="6 教中 325"></div>
      <div class="field"><label>宣讲会编号 id</label><input id="id" type="number" value="136991"></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>样式</h2>
      <div class="field"><label>配色</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="row">
        <div class="field"><label>模块形状</label>
          <select id="module">
            <option value="rounded" selected>圆角（默认）</option>
            <option value="classy">优雅圆角</option>
            <option value="square">经典方块</option>
            <option value="dot">圆点</option>
            <option value="diamond">菱形</option>
          </select></div>
        <div class="field"><label>定位点</label>
          <select id="eye">
            <option value="rounded" selected>圆角</option>
            <option value="circle">圆形</option>
            <option value="square">方形</option>
          </select></div>
      </div>
      <div class="switch"><span>渐变填充</span><div class="tog" id="t-gradient"></div></div>
      <div class="switch"><span>中心 logo</span><div class="tog" id="t-logo"></div></div>
      <div class="switch on"><span>信息卡片</span><div class="tog on" id="t-card"></div></div>
    </div>
  </div>

  <div class="preview">
    <div class="stage">
      <span class="badge" id="badge">实时预览</span>
      <img id="img" alt="签到码预览" src="/api/preview.png">
    </div>
    <div class="bar">
      <button class="btn" id="download">下载 PNG</button>
      <button class="btn ghost" id="copy">复制签到链接</button>
    </div>
    <div class="url" id="url"></div>
    <div class="hint">改任何参数都会自动重绘。生成的图片可直接打印，二维码内容与平台签到链接完全一致。</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const state = { theme:'hdu', gradient:false, logo:false, card:true };
let timer = null;

async function loadThemes(){
  const res = await fetch('/api/themes');
  const list = await res.json();
  $('swatches').innerHTML = list.map(t =>
    `<div class="sw ${t.key==='hdu'?'on':''}" data-k="${t.key}">
       <span class="dot" style="background:linear-gradient(135deg,${t.dark},${t.dark2})"></span>${t.name}
     </div>`).join('');
  $('swatches').addEventListener('click', e => {
    const el = e.target.closest('.sw'); if(!el) return;
    state.theme = el.dataset.k;
    [...$('swatches').children].forEach(c => c.classList.toggle('on', c===el));
    render();
  });
}

function toggle(el, key){
  el.addEventListener('click', () => {
    state[key] = !state[key];
    el.classList.toggle('on', state[key]);
    render();
  });
}

function query(){
  const p = new URLSearchParams({
    id: $('id').value || '136991',
    company: $('company').value,
    title: $('title').value,
    date: $('date').value,
    time: $('time').value,
    location: $('location').value,
    theme: state.theme,
    module: $('module').value,
    eye: $('eye').value,
    gradient: state.gradient,
    logo: state.logo,
    card: state.card,
  });
  return p.toString();
}

function render(){
  clearTimeout(timer);
  timer = setTimeout(() => {
    const img = $('img');
    img.classList.add('loading');
    img.onload = () => img.classList.remove('loading');
    img.src = '/api/preview.png?' + query() + '&t=' + Date.now();
    fetch('/api/link?id=' + ($('id').value || '136991'))
      .then(r => r.json()).then(d => { $('url').textContent = d.url; });
  }, 180);
}

$('download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = '/api/preview.png?' + query();
  a.download = `signin-${$('id').value || 'code'}.png`;
  a.click();
});

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('url').textContent); $('copy').textContent='已复制'; }
  catch(e){ $('copy').textContent='复制失败'; }
  setTimeout(()=>{ $('copy').textContent='复制签到链接'; }, 1400);
});

document.querySelectorAll('input,select').forEach(el => {
  el.addEventListener('input', render);
  el.addEventListener('change', render);
});
toggle($('t-gradient'), 'gradient');
toggle($('t-logo'), 'logo');
toggle($('t-card'), 'card');

const today = new Date();
const iso = new Date(today.getTime() + 86400000).toISOString().slice(0,10);
$('date').value = iso;

loadThemes();
render();
</script>
</body>
</html>
